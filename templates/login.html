<!doctype html><html lang="{{lang}}"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Monitor · Sign in</title><style>body{margin:0;background:#0c1221;color:#eaf0ff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.card{background:#182238;padding:42px;border-radius:18px;width:min(360px,85vw);box-shadow:0 20px 80px #0005}h1{margin-top:0}input,button{box-sizing:border-box;width:100%;padding:13px;border-radius:9px;margin:9px 0;border:1px solid #3a4965;background:#101a2d;color:white}button{background:#576dff;border:0;cursor:pointer;font-weight:700}.muted{color:#9eacc7}</style><div class="card"><h1>◈ Monitor</h1><p class="muted">Secure administrator access</p>{% for message in get_flashed_messages() %}<p>{{message}}</p>{% endfor %}<form method="post"><input name="username" placeholder="Username" required autocomplete="username"><input name="password" type="password" placeholder="Password" required autocomplete="current-password"><button>Sign in</button></form></div></html>
